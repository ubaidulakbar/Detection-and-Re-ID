nc: 3

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]
scale: n

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,  [64, 3, 2]]                # 0-P1/2
  - [-1, 1, Conv,  [128, 3, 2]]               # 1-P2/4
  - [-1, 2, C3k2,  [192, False, 0.25]]        # 2
  - [-1, 1, Conv,  [192, 3, 2]]               # 3-P3/8
  - [-1, 2, C3k2,  [384, False, 0.25]]        # 4
  - [-1, 1, Conv,  [384, 3, 2]]               # 5-P4/16
  - [-1, 2, C3k2,  [640, True, 0.5]]          # 6 stronger P4 (more channels, residual)
  - [-1, 1, SPPF,  [640, 5]]                  # 7 P4-context

head:
  # P4 -> P3
  - [7, 1, nn.Upsample, [None, 2, "nearest"]]  # 8 up P4 -> P3
  - [[-1, 4], 1, Concat, [1]]                  # 9 cat with P3
  - [-1, 2, A2C2f, [256, False, -1]]           # 10 P3/8 (stronger: 2 repeats)

  # P3 -> P4 (fused)
  - [10, 1, Conv, [384, 3, 2]]                 # 11 down to P4/16
  - [[-1, 7], 1, Concat, [1]]                  # 12 cat P4-context
  - [-1, 2, C3k2, [384, False]]                # 13 P4/16 fused

  # P4 -> P5 (real P5/32)
  - [13, 1, Conv, [256, 3, 2]]                 # 14 P5/32
  - [-1, 1, C3k2, [256, False, 0.25]]          # 15 P5/32 refined

  # Detect heads: P3, P4, P5
  - [[10, 13, 15], 1, Detect, [nc]]            # 16 Detect(P3, P4, P5)